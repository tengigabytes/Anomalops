# Definition of done checks (docs/dev/git-workflow.md, section 3).
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  limits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: File limits, docs indexes and links
        run: python3 scripts/check_limits.py
      - name: Module dependency rules (ADR-0007)
        run: python3 scripts/check_module_deps.py
      - name: Device profiles match their probe reports (ADR-0003)
        run: for f in assets/device-profiles/*.json; do python3 scripts/probe_to_profile.py "$(basename "$f" .json)" --check; done

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      # gradle/gradle-daemon-jvm.properties requires JDK 25 for the Gradle daemon.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build both flavors and the probe, run unit tests and detekt
        run: ./gradlew --console=plain assembleFossDebug assemblePlayDebug :tools:probe:assembleDebug test detekt
      - name: Flavor permissions (NFR-8, ADR-0010)
        run: python3 scripts/check_flavor_manifests.py
